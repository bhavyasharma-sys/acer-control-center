name: Build and Package

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make \
            meson ninja-build pkg-config libxkbcommon-dev libwayland-dev libx11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check installer scripts
        run: bash -n install.sh uninstall.sh packaging/build-package.sh packaging/scripts/postinstall.sh packaging/scripts/postremove.sh

      - name: Build native library
        run: |
          meson setup target/ci-lib lib --prefix=/usr --libdir=lib --buildtype=release
          meson compile -C target/ci-lib

      # Compiler output is echoed into the job summary on failure so the errors
      # are readable without downloading the raw run log.
      # Each crate is checked separately so a failure names the crate, and the
      # first lines of the compiler output are re-emitted as annotations so the
      # reason is readable without the raw log archive.
      - name: Check daemon and GUI
        shell: bash
        run: |
          log="${RUNNER_TEMP:-/tmp}/cargo-check.log"
          cargo --version; rustc --version
          # $1 = annotation title, $2 = a --message-format short log, so every
          # diagnostic is one line and the errors are not buried under warnings.
          announce() {
            local detail
            detail="$(sed -e 's/\x1b\[[0-9;]*m//g' "$2" | grep -E ': error' | head -n 60)"
            [ -n "$detail" ] || detail="$(sed -e 's/\x1b\[[0-9;]*m//g' "$2" | head -n 60)"
            detail="${detail//%/%25}"
            detail="${detail//$'\n'/%0A}"
            echo "::error title=$1::${detail//$'\r'/%0D}"
          }
          short_log="${RUNNER_TEMP:-/tmp}/cargo-check-short.log"
          status=0
          : >"$log"
          cargo check --locked --color never --manifest-path daemon/Cargo.toml >>"$log" 2>&1 || status=1
          if [ "$status" -ne 0 ]; then
            cat "$log"
            cargo check --locked --color never --message-format short \
              --manifest-path daemon/Cargo.toml >"$short_log" 2>&1 || true
            announce "daemon cargo check failed" "$short_log"; exit 1
          fi
          : >"$log"
          ACERCONTROL_LIB_DIR="$PWD/target/ci-lib" \
            cargo check --locked --color never --manifest-path gui/Cargo.toml >>"$log" 2>&1 || status=1
          cat "$log"
          if [ "$status" -ne 0 ]; then
            ACERCONTROL_LIB_DIR="$PWD/target/ci-lib" \
              cargo check --locked --color never --message-format short \
              --manifest-path gui/Cargo.toml >"$short_log" 2>&1 || true
            announce "gui cargo check failed" "$short_log"; exit 1
          fi

      - name: Run unit tests
        # Telemetry parsers, NVIDIA command construction and rejection
        # detection, power-limit readback mismatches, profile defaults and
        # config parsing, and UI state logic. Hardware and command execution
        # are mocked, so these run without an Acer laptop or NVIDIA GPU.
        shell: bash
        env:
          ACERCONTROL_LIB_DIR: ${{ github.workspace }}/target/ci-lib
        run: |
          log="$RUNNER_TEMP/cargo-test.log"
          if ! {
            cargo test --locked --manifest-path daemon/Cargo.toml &&
            cargo test --locked --manifest-path gui/Cargo.toml
          } >"$log" 2>&1; then
            cat "$log"
            {
              echo '## cargo test failed'
              echo '```'
              grep -E '^(error|warning)(\[|:)|^(failures|test result):' -A 8 "$log" | head -n 400
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            # Surface the failing tests / compile errors as an annotation so
            # the reason is readable without the raw log archive.
            detail="$(grep -E ': error|FAILED$|panicked at' "$log" | head -n 40)"
            [ -n "$detail" ] || detail="$(tail -n 40 "$log")"
            detail="${detail//%/%25}"
            detail="${detail//$'\n'/%0A}"
            echo "::error title=cargo test failed::${detail//$'\r'/%0D}"
            exit 1
          fi
          cat "$log"

  # Separate job: the kernel module is built by DKMS on the target machine at
  # install time, and packaging only ships the driver source, so nothing else
  # here depends on this step succeeding. Keeping it apart means a kernel
  # headers/API problem on the CI runner cannot hide the results of the Rust
  # checks, the unit tests or the package builds. The build step is
  # continue-on-error: when the runner's newest headers are ahead of the
  # source's supported range the step (not the job) shows as failed and posts
  # the first compiler errors as a check annotation, so PR checks stay green
  # while the exact breakage remains readable from the checks API.
  driver:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make kmod linux-headers-generic

      - name: Build kernel driver
        id: build
        continue-on-error: true
        working-directory: driver
        shell: bash
        run: |
          HEADER_DIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort | tail -n1)"
          test -n "$HEADER_DIR"
          echo "Building against $HEADER_DIR"
          log="$RUNNER_TEMP/driver-build.log"
          if ! make KDIR="$HEADER_DIR" >"$log" 2>&1; then
            cat "$log"
            {
              echo '## kernel driver build failed'
              echo "Headers: \`$HEADER_DIR\`"
              echo '```'
              grep -E 'error|Error' -A 6 "$log" | head -n 300
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            # Raw job logs are not reachable from every client, so surface the
            # first compiler errors as a check annotation instead (percent and
            # newline escaped for the workflow command protocol).
            msg="$(grep -E 'error[: ]' "$log" | head -n 12 \
                   | sed -e 's/%/%25/g' -e 's/:://g' \
                   | awk '{printf "%s%%0A", $0}')"
            echo "::error title=kernel driver build failed (non-blocking)::${msg}"
            exit 1
          fi
          cat "$log"
          find . -name '*.ko' -print -quit | grep -q .

      - name: Note driver build status
        if: always()
        run: |
          {
            echo '### Kernel driver (non-blocking)'
            echo "Outcome: \`${{ steps.build.outcome }}\`."
            echo 'This step compile-tests the out-of-tree module against the'"'"'runner'"'"'s newest headers. It does not gate merges: the module is built by DKMS on the target machine at install time, and a runner kernel newer than the supported source range must not block unrelated changes. When it fails, the first compiler errors are posted as a check annotation.'
          } >>"$GITHUB_STEP_SUMMARY"

  packages:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            libdir: /usr/lib
          - format: rpm
            libdir: /usr/lib64
          - format: archlinux
            libdir: /usr/lib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ meson ninja-build pkg-config zstd \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go for nFPM
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build ${{ matrix.format }} package
        env:
          LIBDIR: ${{ matrix.libdir }}
          VERSION: 2.0.0
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          packaging/build-package.sh "${{ matrix.format }}"

      - name: Inspect package metadata
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          case "$FORMAT" in
            deb) dpkg-deb --info dist/*.deb ;;
            rpm)
              sudo apt-get install -y rpm
              rpm -qp --info dist/*.rpm
              ;;
            archlinux)
              tar --zstd -tf dist/*.pkg.tar.zst | grep -q '\.PKGINFO$'
              ;;
          esac

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: acer-package-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: acer-package-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Acer Control Center ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
